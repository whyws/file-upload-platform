name: Deploy to Aliyun ECS

# 触发条件：当推送到 main 分支时触发
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. 安装前端依赖并构建
      - name: Install dependencies and build frontend
        run: |
          npm install
          npm run build

      # 4. 通过 SSH 部署到阿里云服务器
      - name: Deploy to Aliyun ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.ALIYUN_HOST }}        # 你的服务器 IP
          username: ${{ secrets.ALIYUN_USER }}     # 登录用户名（通常是 root）
          key: ${{ secrets.ALIYUN_SSH_KEY }}       # SSH 私钥
          port: 22
          source: "./dist/,./server/,package.json"  # 要上传的文件/文件夹
          target: "/var/www/file-upload-platform"   # 服务器上的目标路径
          strip_components: 0

      # 5. 在服务器上执行部署命令
      - name: Execute deployment commands
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USER }}
          key: ${{ secrets.ALIYUN_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/file-upload-platform
            
            # 安装后端依赖
            cd server && npm install && cd ..
            
            # 复制前端文件到 Nginx 目录
            cp -r dist/* /var/www/html/
            
            # 重启 PM2 服务
            pm2 reload all
            
            echo "✅ 部署完成！"